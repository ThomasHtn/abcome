version: 2

# Both subprojects pull a large transitive tree (Spring Boot on one side, the Angular toolchain on the
# other). The delivery scans the built images and dependency-review.yml the dependencies a pull request
# adds; these updates are what clears an advisory on something already merged.
#
# Each ecosystem is grouped into a single pull request per run: seven separate bumps a week on a
# personal project get ignored, one grouped bump gets reviewed. Security updates are deliberately
# left ungrouped by GitHub, so an advisory still arrives as its own pull request.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions are migrations (Spring Boot, Angular and its TypeScript, Java, Node, Postgres),
    # done on purpose, not merged from a weekly bump.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      backend-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions are migrations (Spring Boot, Angular and its TypeScript, Java, Node, Postgres),
    # done on purpose, not merged from a weekly bump.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      frontend-dependencies:
        patterns:
          - '*'

  # Base images are pinned by version and digest: without these entries a JRE or nginx advisory
  # would never surface, since a pinned image no longer moves on its own.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    # Major versions are migrations (Spring Boot, Angular and its TypeScript, Java, Node, Postgres),
    # done on purpose, not merged from a weekly bump.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      docker-images:
        patterns:
          - '*'

  # compose.yaml for local runs, deploy/compose.yaml for servers (postgres, nginx, Caddy).
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy
    schedule:
      interval: monthly
    # Major versions are migrations (Spring Boot, Angular and its TypeScript, Java, Node, Postgres),
    # done on purpose, not merged from a weekly bump.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      compose-images:
        patterns:
          - '*'

  # The workflows pin actions by commit SHA (version in a comment); these updates move both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
