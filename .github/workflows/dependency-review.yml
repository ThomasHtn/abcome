name: Dependency review

# Blocks a pull request that adds or bumps a dependency with a known high or critical advisory.
# Dependabot only reports what is already merged.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/pom.xml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
