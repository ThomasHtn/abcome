name: Deliver

# Every push to main: both test suites, then both images pushed to GHCR, tagged with the commit.
# The server only pulls `sha-<commit>`, so a commit whose tests failed has no image and cannot be deployed.
on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a running delivery: only the latest commit of main gets deployed.
concurrency:
  group: deliver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend-ci.yml

  images:
    name: Image ${{ matrix.app }}
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    # Both images get every commit's tag, even when only one side changed: the server tracks a single number.
    strategy:
      matrix:
        app:
          - backend
          - frontend

    steps:
      # Registry paths must be lowercase; the owner name is not.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/littlewords-${{ matrix.app }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<full commit> is what the server deploys; main follows the latest delivery, for local tries.
      # The OCI labels carry the commit and the repository, so a running container says where it comes from.
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=main

      # Git context of this exact commit, no checkout needed. The layer cache lives in GitHub Actions,
      # so an image whose side did not change rebuilds in seconds.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: '{{defaultContext}}:${{ matrix.app }}'
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
