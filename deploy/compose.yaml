# Production template: the published images, PostgreSQL and Caddy (HTTPS from Let's Encrypt) on one machine.
# Usage: deploy/README.md. CI starts this very file on every delivery, so it cannot drift from the images.
# Behind an existing reverse proxy (Traefik, nginx), drop `caddy` and route as backend/README.md says.
name: littlewords

# =============================================================================
# Shared hardening
# =============================================================================
# No process may gain privileges after start, whatever runs inside.
x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *hardened
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: littlewords
      POSTGRES_USER: littlewords
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U littlewords -d littlewords"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  backend:
    <<: *hardened
    image: ${IMAGE_REGISTRY:-ghcr.io/thomashtn}/littlewords-backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    # Explicit list: only what the backend reads leaves .env.
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/littlewords
      DB_USERNAME: littlewords
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      FAMILY_PASSWORD_HASH: ${FAMILY_PASSWORD_HASH:?FAMILY_PASSWORD_HASH must be set}
      READER_PASSWORD_HASH: ${READER_PASSWORD_HASH:-}
      CHILD_NAME: ${CHILD_NAME:?CHILD_NAME must be set}
      CHILD_BIRTHDATE: ${CHILD_BIRTHDATE:-}
      APP_NAME: ${APP_NAME:-ABCome}
      APP_NAME_ACCENT: ${APP_NAME_ACCENT:-ome}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Paris}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    # Root filesystem read-only; Tomcat buffers uploads in /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m

  frontend:
    <<: *hardened
    image: ${IMAGE_REGISTRY:-ghcr.io/thomashtn}/littlewords-frontend:${IMAGE_TAG:?IMAGE_TAG must be set}
    networks:
      - internal
    # The unprivileged nginx image keeps its pid and temporary files in /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 64m

  # Only service on the outside network: terminates HTTPS and renews the certificate on its own.
  caddy:
    <<: *hardened
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
      - outside
    depends_on:
      - backend
      - frontend
    cap_drop:
      - ALL
    # Binds 80 and 443 as root without the other root capabilities.
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  # No route to the internet: the database, the API and nginx only ever talk to each other and to Caddy.
  internal:
    internal: true
  # Internet access for Caddy alone: the ACME challenge and the published ports.
  outside:

volumes:
  # Words, stages and recordings: the only copy, dumped by backup.sh.
  postgres-data:
  # Certificates and the ACME account; losing them only means asking Let's Encrypt again.
  caddy-data:
  caddy-config:
