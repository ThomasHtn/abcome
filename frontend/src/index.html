<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Little Words</title>
    <base href="/" />
    <!-- The on-screen keyboard overlays the page instead of resizing it, so fixed bars stay put. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fff9f6" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- iOS ignores the manifest icons and needs an opaque PNG for the home screen. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Served by the API, so the home-screen shortcut carries the name of this deployment (APP_NAME). -->
    <link rel="manifest" href="api/branding/manifest" />
    <!-- Both faces show on the first screen, so they load with the page. -->
    <link
      rel="preload"
      href="fonts/fredoka/fredoka-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/nunito/nunito-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- Lapinou while the app starts; the app fades it out once its first screen shows. -->
    <div class="app-splash" aria-hidden="true">
      <div class="app-splash__halo">
        <!-- eslint-disable @angular-eslint/template/prefer-ngsrc -- static page, drawn before Angular runs. -->
        <img
          class="app-splash__mascot"
          src="assets/mascot/idle.svg"
          alt=""
          width="120"
          height="150"
        />
        <!-- eslint-enable @angular-eslint/template/prefer-ngsrc -->
      </div>
    </div>
    <app-root></app-root>
  </body>
</html>
