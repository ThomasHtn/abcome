<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>ABCome</title>
    <base href="/" />
    <!-- The on-screen keyboard overlays the page instead of resizing it, so fixed bars stay put. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fff9f6" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- iOS ignores the manifest icons and needs an opaque PNG for the home screen. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Both faces show on the first screen, so they load with the page. -->
    <link
      rel="preload"
      href="fonts/fredoka/fredoka-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/nunito/nunito-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
