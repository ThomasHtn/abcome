<!-- Bars only: decorative, the clock and the buttons say what is happening. -->
<div
  class="level-bars flex items-center justify-center"
  aria-hidden="true"
  [class.level-bars--sm]="size() === 'sm'"
  [class.level-bars--live]="tone() === 'live'"
  [class.level-bars--clip]="tone() === 'clip'"
  [class.level-bars--played]="tone() === 'played'"
>
  @for (level of shownLevels(); track $index) {
    <span
      class="level-bars__bar"
      [class.level-bars__bar--played]="$index < playedBars()"
      [style.block-size.px]="height(level)"
    ></span>
  }
</div>
