<!-- Play or stop; the name follows the state. -->
<button
  class="audio-button"
  type="button"
  [class.audio-button--sm]="size() === 'sm'"
  [class.audio-button--lg]="size() === 'lg'"
  [class.audio-button--playing]="playing()"
  [attr.aria-label]="name()"
  (click)="toggle()"
>
  @if (playing()) {
    <svg app-icon name="square" filled [size]="iconSize().stop"></svg>
  } @else {
    <svg app-icon name="play" filled [size]="iconSize().play"></svg>
  }
</button>
