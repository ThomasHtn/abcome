<!-- Whole card is the link to the word's page, read as one sentence. -->
<a
  class="word-card pop flex items-center gap-3.5"
  [routerLink]="card().path"
  [attr.aria-label]="card().ariaLabel"
  [style.--word-card-index]="stagger()"
>
  <app-date-tile [day]="card().day" [month]="card().month" />

  <!-- The word as the title, then what the child says now, in salmon. -->
  <span class="word-card__text flex min-w-0 flex-1 flex-col gap-0.5">
    <!-- The title, then what changed elsewhere since this device last looked as a lavender tag after its last word; the aria-label says it. -->
    <span class="word-card__label">
      {{ card().label }}
      @if (card().change; as change) {
        <span class="word-card__change" aria-hidden="true">
          <svg
            class="word-card__change-icon"
            app-icon
            [name]="changeIcons[change]"
            [size]="14"
            [strokeWidth]="2.6"
          ></svg>
        </span>
      }
    </span>
    <!-- Each language orders the name and the spoken form its own way, around the salmon span. -->
    <span class="word-card__said"
      >{{ 'home.wordCard.saidBefore' | transloco: { childName: childName() }
      }}<span class="word-card__spoken">{{ card().spoken | quote }}</span
      >{{ 'home.wordCard.saidAfter' | transloco: { childName: childName() } }}</span
    >
  </span>

  <!-- Current status as a small dot; the aria-label reads it out. -->
  <app-status-dot class="word-card__current" [status]="card().status" />
</a>
