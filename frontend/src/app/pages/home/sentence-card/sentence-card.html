<!-- Whole card is the edit button, read as one sentence. -->
<button
  class="sentence-card pop flex items-center gap-3.5"
  type="button"
  [attr.aria-label]="card().ariaLabel"
  [style.--sentence-card-index]="stagger()"
  (click)="edit.emit(card().sentence)"
>
  <app-date-tile [day]="card().day" [month]="card().month" />

  <!-- What Côme said, then what he meant when it is known. -->
  <span class="sentence-card__text flex min-w-0 flex-1 flex-col gap-1">
    <span class="sentence-card__spoken">{{ card().sentence.spoken | quote }}</span>
    @if (card().sentence.meaning; as meaning) {
      <span class="sentence-card__meaning">{{ meaning }}</span>
    }
  </span>
</button>
