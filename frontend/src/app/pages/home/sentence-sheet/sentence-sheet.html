<app-bottom-sheet
  [heading]="'home.sentenceSheet.heading' | transloco"
  [open]="true"
  [error]="error()"
  (openChange)="onOpenChange($event)"
>
  <!-- What the child meant, the sentence's title, then its first pronunciation; Enter saves. -->
  <form
    id="sentence-sheet-form"
    class="flex flex-col gap-3.5"
    novalidate
    (submit)="$event.preventDefault(); save()"
  >
    <app-text-field
      [label]="'home.sentenceSheet.meaningLabel' | transloco"
      required
      [placeholder]="'home.sentenceSheet.meaningPlaceholder' | transloco"
      multiline
      [maxLength]="labelMaxLength"
      [(value)]="label"
    />
    <app-pronunciation-form
      kind="sentence"
      [spokenLabel]="spokenLabel()"
      [spokenPlaceholder]="'home.sentenceSheet.spokenPlaceholder' | transloco"
      [dateLabel]="'home.sentenceSheet.dateLabel' | transloco"
      [(draft)]="draft"
    />
  </form>

  <!-- Cancel or save. -->
  <div sheetActions class="grid grid-cols-2 gap-2.5">
    <button app-button type="button" variant="outline" [disabled]="busy()" (click)="closed.emit()">
      {{ 'home.sentenceSheet.cancel' | transloco }}
    </button>
    <button app-button type="submit" form="sentence-sheet-form" [disabled]="!canSave()">
      {{ 'home.sentenceSheet.save' | transloco }}
    </button>
  </div>
</app-bottom-sheet>
