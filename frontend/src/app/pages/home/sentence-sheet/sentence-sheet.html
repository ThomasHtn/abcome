<app-bottom-sheet
  heading="Nouvelle phrase"
  [open]="true"
  [error]="error()"
  (openChange)="onOpenChange($event)"
>
  <!-- What the child meant, the sentence's title, then its first pronunciation; Enter saves. -->
  <form
    id="sentence-sheet-form"
    class="flex flex-col gap-3.5"
    novalidate
    (submit)="$event.preventDefault(); save()"
  >
    <app-text-field
      label="Ce qu'il voulait dire"
      required
      placeholder="ex. Il n'y a plus de gâteau"
      multiline
      [maxLength]="labelMaxLength"
      [(value)]="label"
    />
    <app-pronunciation-form
      kind="sentence"
      [spokenLabel]="'Ce que ' + childName() + ' a dit'"
      spokenPlaceholder="ex. a pu ato"
      dateLabel="Dite le"
      [(draft)]="draft"
    />
  </form>

  <!-- Cancel or save. -->
  <div sheetActions class="grid grid-cols-2 gap-2.5">
    <button app-button type="button" variant="outline" [disabled]="busy()" (click)="closed.emit()">
      Annuler
    </button>
    <button app-button type="submit" form="sentence-sheet-form" [disabled]="!canSave()">
      Enregistrer
    </button>
  </div>
</app-bottom-sheet>
