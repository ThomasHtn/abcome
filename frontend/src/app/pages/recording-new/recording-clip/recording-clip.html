<!-- The recorded sound, always playable. -->
<div class="recording-clip flex items-center gap-3">
  <app-audio-button
    [label]="'recordingNew.clip.listenLabel' | transloco"
    [src]="src()"
    (playingChange)="playing.set($event)"
  />
  <app-level-bars
    class="min-w-0 flex-1"
    size="sm"
    [levels]="levels()"
    [tone]="playing() ? 'played' : 'clip'"
  />
  <span class="recording-clip__duration">{{ duration() }}</span>
</div>
