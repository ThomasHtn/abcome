    <rect class="piece" x="194" y="192" width="12" height="16" rx="3" fill="#9488DF" style="--x:-163px;--y:23px;--r:239deg;animation-delay:0.03s" />
    <circle class="piece" cx="200" cy="200" r="6" fill="#3FB26A" style="--x:-139px;--y:12px;--r:306deg;animation-delay:0.06s" />
