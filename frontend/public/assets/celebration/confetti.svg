    <rect class="piece" x="194" y="192" width="12" height="16" rx="3" fill="#F7957C" style="--x:-109px;--y:-51px;--r:440deg;animation-delay:0.00s" />
    <circle class="piece" cx="200" cy="200" r="6" fill="#B3A9EC" style="--x:-102px;--y:-130px;--r:507deg;animation-delay:0.03s" />
    <rect class="piece" x="194" y="192" width="12" height="16" rx="3" fill="#FFD0C1" style="--x:-80px;--y:-115px;--r:214deg;animation-delay:0.06s" />
    <rect class="piece" x="194" y="192" width="12" height="16" rx="3" fill="#5246A8" style="--x:-26px;--y:-183px;--r:281deg;animation-delay:0.09s" />
  </g>
</svg>
