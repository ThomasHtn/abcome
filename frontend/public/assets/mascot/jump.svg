<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 120 150" width="120" height="150">
  <!-- Happy Lapinou jumping once: tap on the mascot, right password, word mastered. -->
  <style>
    /* Squashes and stretches from the feet, like a real landing. */
    .lapinou {
      transform-box: fill-box;
      transform-origin: 50% 90%;
    }

    /* Motion only for users who did not ask for less of it; the happy face alone remains otherwise. */
    @media (prefers-reduced-motion: no-preference) {
      .lapinou {
        animation: jump 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
    }

    /* One jump with squash on landing and a small rebound. */
    @keyframes jump {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }
      25% {
        transform: translateY(-26px) scale(1.06, 0.94);
      }
      50% {
        transform: translateY(0) scale(1.08, 0.9);
      }
      70% {
        transform: translateY(-8px) scale(0.97, 1.03);
      }
    }
  </style>
  <g class="lapinou">
    <!-- Ears: salmon outside, lavender inside. -->
    <ellipse cx="42" cy="32" rx="11" ry="27" fill="#FFB49E" transform="rotate(-14 42 50)" />
    <ellipse cx="42" cy="34" rx="5" ry="17" fill="#D2CBF6" transform="rotate(-14 42 50)" />
    <ellipse cx="78" cy="32" rx="11" ry="27" fill="#FFB49E" transform="rotate(10 78 50)" />
    <ellipse cx="78" cy="34" rx="5" ry="17" fill="#D2CBF6" transform="rotate(10 78 50)" />
    <!-- Head and body in one round shape. -->
    <ellipse cx="60" cy="76" rx="44" ry="38" fill="#FFB49E" />
    <!-- Eyes closed by joy, drawn as arcs. -->
    <path d="M39 71q6-7 12 0M69 71q6-7 12 0" stroke="#2F2A40" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <!-- Cheeks. -->
    <circle cx="33" cy="84" r="7" fill="#F7957C" opacity="0.75" />
    <circle cx="87" cy="84" r="7" fill="#F7957C" opacity="0.75" />
    <!-- Wide open laugh. -->
    <path d="M49 84 Q60 99 71 84 Z" fill="#2F2A40" />
  </g>
</svg>
