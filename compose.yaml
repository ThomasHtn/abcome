# Whole app from its images on http://localhost:8000: try it, or check the images before a deployment.
# Local only: no TLS, no backups. Day-to-day development runs natively (CONTRIBUTING.md), on the postgres below.
# Usage: `docker compose up --build` (or `make up`), nothing to configure; sign in with littlewords-demo-passphrase.
# A deployment starts from deploy/compose.example.yaml instead.
name: littlewords

services:
  # Also the development database (`make db`): published on 127.0.0.1:5433, never on the network.
  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: littlewords
      POSTGRES_USER: littlewords
      POSTGRES_PASSWORD: littlewords
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U littlewords -d littlewords"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Demo settings first, then your backend/.env if any. Raw: Compose would otherwise expand the $ signs
    # of the unquoted Argon2 hashes.
    env_file:
      - path: backend/.env.example
        format: raw
      - path: backend/.env
        format: raw
        required: false
    # Replaces the localhost database of the env files with the one above.
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/littlewords
      DB_USERNAME: littlewords
      DB_PASSWORD: littlewords
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend

  # Plays the production reverse proxy: /api and /readyz to the backend, the rest to the frontend, one origin.
  proxy:
    image: nginxinc/nginx-unprivileged:1.31.7-alpine3.24@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    ports:
      - "127.0.0.1:8000:8080"
    configs:
      - source: proxy
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

configs:
  proxy:
    # $$ escapes Compose interpolation, nginx receives $host.
    content: |
      server {
        listen 8080;
        client_max_body_size 2m;
        location /api/ {
          proxy_pass http://backend:8080;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
        }
        location = /readyz {
          proxy_pass http://backend:8080;
        }
        location / {
          proxy_pass http://frontend:8080;
          proxy_set_header Host $$host;
        }
      }

volumes:
  postgres-data:
