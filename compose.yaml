# Whole app from its images on http://localhost:8000: try it, or check the images before a deployment.
# Local only: no TLS, no backups. Day-to-day development runs natively (CONTRIBUTING.md).
# Usage: backend/.env filled as for development, then `docker compose up --build`.
name: littlewords

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: littlewords
      POSTGRES_USER: littlewords
      POSTGRES_PASSWORD: littlewords
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U littlewords -d littlewords"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Raw: Compose would otherwise expand the $ signs of the unquoted Argon2 hashes.
    env_file:
      - path: backend/.env
        format: raw
    # Replaces the localhost database of backend/.env with the one above.
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/littlewords
      DB_USERNAME: littlewords
      DB_PASSWORD: littlewords
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend

  # Plays the production reverse proxy: /api to the backend, the rest to the frontend, one origin.
  proxy:
    image: nginxinc/nginx-unprivileged:1.29.8-alpine3.23@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    ports:
      - "127.0.0.1:8000:8080"
    configs:
      - source: proxy
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

configs:
  proxy:
    # $$ escapes Compose interpolation, nginx receives $host.
    content: |
      server {
        listen 8080;
        client_max_body_size 2m;
        location /api/ {
          proxy_pass http://backend:8080;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
        }
        location / {
          proxy_pass http://frontend:8080;
          proxy_set_header Host $$host;
        }
      }

volumes:
  postgres-data:
