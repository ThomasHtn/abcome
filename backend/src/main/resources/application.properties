# =============================================================================
# Application
# =============================================================================
# Name shown in logs and actuator info.
spring.application.name=littlewords
# No in-memory user: without this Boot logs a generated password nobody uses.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# =============================================================================
# Database
# =============================================================================
# PostgreSQL 17 connection; the defaults match the local development database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/littlewords}
spring.datasource.username=${DB_USERNAME:littlewords}
spring.datasource.password=${DB_PASSWORD:littlewords}
# Small pool: a family app on a shared VPS never needs Hikari's default of ten connections.
spring.datasource.hikari.maximum-pool-size=5
# A database outage fails a request after 3 s instead of Hikari's 30 s, so the screen says so quickly.
spring.datasource.hikari.connection-timeout=3000
# Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
# No database session while rendering JSON: services return DTOs.
spring.jpa.open-in-view=false
# Instants are written and read in UTC whatever the server time zone.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Migrations under src/main/resources/db/migration run at startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# =============================================================================
# JSON
# =============================================================================
# Instants are serialized in UTC.
spring.jackson.time-zone=UTC
# =============================================================================
# HTTP server
# =============================================================================
# Lets in-flight requests, such as a recording upload, finish on shutdown.
server.shutdown=graceful
# Compresses JSON; error payloads use the problem+json type.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
# Client address from the proxy's X-Forwarded-For, trusted only from private networks (Tomcat RemoteIpValve).
# Not `framework`: it also honours a client-sent `Forwarded` header, which would defeat the login lockout.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
# =============================================================================
# Session (Spring Session JDBC, tables created by Flyway V3)
# =============================================================================
# Flyway owns the session tables too: Spring Session must not create them.
spring.session.jdbc.initialize-schema=never
# A family member stays signed in for 30 days without using the notebook.
spring.session.timeout=30d
# The session cookie itself is set in code (SessionCookieConfig), so it holds without an embedded server.
# =============================================================================
# Actuator
# =============================================================================
# Own port, never routed by the proxy: a routing mistake cannot publish metrics or build details.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Liveness and readiness also on the main port as /livez and /readyz, for the public probe and the healthcheck.
management.endpoint.health.probes.add-additional-paths=true
# Ready means the database answers: an uptime probe on readiness then reports a database outage.
management.endpoint.health.group.readiness.include=readinessState,db
# Tells this application's series apart from the other VPS apps scraped by the same Prometheus.
management.metrics.tags.application=${spring.application.name}
# =============================================================================
# OpenAPI (off unless API_DOCS_ENABLED: the document maps the whole API surface)
# =============================================================================
# Both follow app.api-docs-enabled, which SecurityConfig reads too.
springdoc.api-docs.enabled=${app.api-docs-enabled}
springdoc.swagger-ui.enabled=${app.api-docs-enabled}
# Paths of the OpenAPI document and Swagger UI, opened by SecurityConfig when enabled.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Documents this application's API only, not actuator or framework endpoints.
springdoc.packages-to-scan=io.github.thomashtn.littlewords
springdoc.paths-to-match=/api/**
# =============================================================================
# Application settings
# =============================================================================
# Serves the OpenAPI document and Swagger UI.
app.api-docs-enabled=${API_DOCS_ENABLED:false}
# First name of the child, sent only to a signed-in visitor; empty means the application refuses to start.
app.child-name=${CHILD_NAME:}
# Name of the app on the login screen and in the page titles, so each family's deployment carries its own.
app.branding.name=${APP_NAME:ABCome}
# End of APP_NAME drawn in the accent colour on the login screen; empty for none.
app.branding.name-accent=${APP_NAME_ACCENT:ome}
# Zone of the family: "today" and "not in the future" are judged in it.
app.time-zone=Europe/Paris
# Argon2id hash of the family password; empty means the application refuses to start.
app.auth.password-hash=${FAMILY_PASSWORD_HASH:}
# Argon2id hash of the read-only password, for relatives who only look; empty turns that sign-in off.
app.auth.reader-password-hash=${READER_PASSWORD_HASH:}
# Wrong passwords allowed per address before a lockout. The family shares one public address,
# so the first lockout is short and each next one doubles, up to the cap; a right password resets it.
app.auth.max-failures=${LOGIN_MAX_FAILURES:5}
app.auth.initial-lockout=${LOGIN_INITIAL_LOCKOUT:PT1M}
# Longest lockout, and how long a quiet address keeps its lockout history.
app.auth.max-lockout=${LOGIN_MAX_LOCKOUT:PT15M}
# Turns the lockout off; development only, never in production. The concurrent checks limit stays.
app.auth.lockout-enabled=${LOGIN_LOCKOUT_ENABLED:true}
# Password checks run at once; each holds the hash's memory cost (32 MiB at -m 15), so a burst cannot exhaust the heap.
app.auth.max-concurrent-checks=${LOGIN_MAX_CONCURRENT_CHECKS:2}
# Largest accepted recording, in bytes; a 15-second recording stays well under it.
app.recording.max-bytes=2097152
# Shortest accepted recording, in milliseconds: anything shorter is a mistaken tap.
app.recording.min-duration-ms=300
# Longest accepted recording, in milliseconds.
app.recording.max-duration-ms=15000
