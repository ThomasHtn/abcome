# =============================================================================
# Application
# =============================================================================
# Name shown in logs and actuator info.
spring.application.name=abcome
# No in-memory user: without this Boot logs a generated password nobody uses.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# =============================================================================
# Database
# =============================================================================
# PostgreSQL 17 connection; the defaults match the local development database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/abcome}
spring.datasource.username=${DB_USERNAME:abcome}
spring.datasource.password=${DB_PASSWORD:abcome}
# Small pool: a family app on a shared VPS never needs Hikari's default of ten connections.
spring.datasource.hikari.maximum-pool-size=5
# Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
# No database session while rendering JSON: services return DTOs.
spring.jpa.open-in-view=false
# Instants are written and read in UTC whatever the server time zone.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Migrations under src/main/resources/db/migration run at startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# =============================================================================
# JSON
# =============================================================================
# Instants are serialized in UTC.
spring.jackson.time-zone=UTC
# =============================================================================
# HTTP server
# =============================================================================
# Lets in-flight requests, such as a recording upload, finish on shutdown.
server.shutdown=graceful
# Compresses JSON; error payloads use the problem+json type.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
# Upload limit: a 15-second recording stays well under 2 MB; aligned with nginx and Traefik.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
# Trust X-Forwarded-* from Traefik, otherwise rate limits key every caller on the proxy address.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
# =============================================================================
# Actuator
# =============================================================================
# Only health and info are published; health also exposes the liveness and readiness groups.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# =============================================================================
# OpenAPI (off unless API_DOCS_ENABLED: the document maps the whole API surface)
# =============================================================================
# Both follow app.api-docs-enabled, which SecurityConfig reads too.
springdoc.api-docs.enabled=${app.api-docs-enabled}
springdoc.swagger-ui.enabled=${app.api-docs-enabled}
# Paths of the OpenAPI document and Swagger UI, opened by SecurityConfig when enabled.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Documents this application's API only, not actuator or framework endpoints.
springdoc.packages-to-scan=io.github.thomashtn.abcome
springdoc.paths-to-match=/api/**
# =============================================================================
# Application settings
# =============================================================================
# Serves the OpenAPI document and Swagger UI.
app.api-docs-enabled=${API_DOCS_ENABLED:false}
